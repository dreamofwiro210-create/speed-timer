<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUBIK SPEED TIMER</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050509;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 94%;
  max-width: 700px;
  margin: auto;
  padding: 25px 0 50px;
}

h1 {
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: 22px;
}

#scramble {
  background: #111116;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  font-size: 19px;
  line-height: 1.6;
  word-spacing: 5px;
}

#timer {
  text-align: center;
  font-size: clamp(65px, 18vw, 110px);
  font-weight: bold;
  margin: 45px 0 30px;
  font-variant-numeric: tabular-nums;
}

#start {
  display: block;
  margin: auto;
  padding: 15px 55px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-size: 20px;
  font-weight: bold;
}

#start:active {
  transform: scale(.96);
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 30px 0;
}

.stat {
  background: #111116;
  border-radius: 10px;
  padding: 13px 5px;
  text-align: center;
}

.stat small {
  display: block;
  color: #888;
  margin-bottom: 5px;
}

.stat b {
  font-size: 18px;
}

h2 {
  margin-top: 35px;
}

#clearAll {
  background: #25252b;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 9px;
  margin-bottom: 12px;
}

.solve {
  background: #111116;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
}

.solveTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.solveTime {
  font-size: 22px;
  font-weight: bold;
}

.solveNumber {
  color: #888;
}

.scrambleHistory {
  color: #aaa;
  font-size: 14px;
  line-height: 1.5;
  margin: 10px 0;
}

.buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.buttons button {
  border: none;
  border-radius: 7px;
  padding: 8px 11px;
  background: #24242a;
  color: white;
}

.empty {
  text-align: center;
  color: #777;
  background: #111116;
  padding: 20px;
  border-radius: 12px;
}

/* RUBIK */

.rubikBox {
  position: fixed;
  left: 12px;
  bottom: 12px;
  background: #111116;
  padding: 10px;
  border-radius: 12px;
  z-index: 10;
}

.rubikTitle {
  text-align: center;
  font-size: 12px;
  color: #aaa;
  margin-bottom: 6px;
}

.rubik {
  display: grid;
  grid-template-columns: repeat(4, 28px);
  grid-template-rows: repeat(3, 28px);
  gap: 2px;
}

.face {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
}

.sticker {
  width: 8px;
  height: 8px;
  border-radius: 1px;
  border: 1px solid #222;
}

.white { background: white; }
.yellow { background: #ffd900; }
.green { background: #00a651; }
.blue { background: #1685e5; }
.red { background: #e32626; }
.orange { background: #ff8c00; }

.faceU { grid-column: 2; grid-row: 1; }
.faceL { grid-column: 1; grid-row: 2; }
.faceF { grid-column: 2; grid-row: 2; }
.faceR { grid-column: 3; grid-row: 2; }
.faceB { grid-column: 4; grid-row: 2; }
.faceD { grid-column: 2; grid-row: 3; }

@media (max-width: 500px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .rubikBox {
    transform: scale(.85);
    transform-origin: bottom left;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>RUBIK SPEED TIMER</h1>

<div id="scramble">Generating scramble...</div>

<div id="timer">0.00</div>

<button id="start">START</button>

<div class="stats">

<div class="stat">
<small>Solves</small>
<b id="count">0</b>
</div>

<div class="stat">
<small>PB</small>
<b id="pb">--</b>
</div>

<div class="stat">
<small>Ao5</small>
<b id="ao5">--</b>
</div>

<div class="stat">
<small>Ao12</small>
<b id="ao12">--</b>
</div>

</div>

<h2>Lịch sử</h2>

<button id="clearAll">🗑 Xóa tất cả</button>

<div id="solves">
<div class="empty">Chưa có solve</div>
</div>

</div>


<!-- RUBIK 6 MẶT -->

<div class="rubikBox">

<div class="rubikTitle">SCRAMBLE VIEW</div>

<div class="rubik">

<div class="face faceU" id="U"></div>
<div class="face faceL" id="L"></div>
<div class="face faceF" id="F"></div>
<div class="face faceR" id="R"></div>
<div class="face faceB" id="B"></div>
<div class="face faceD" id="D"></div>

</div>

</div>


<script>

const timer = document.getElementById("timer");
const startButton = document.getElementById("start");
const scrambleElement = document.getElementById("scramble");

const countElement = document.getElementById("count");
const pbElement = document.getElementById("pb");
const ao5Element = document.getElementById("ao5");
const ao12Element = document.getElementById("ao12");

const solvesElement = document.getElementById("solves");
const clearAllButton = document.getElementById("clearAll");

let startTime = 0;
let timerInterval = null;
let running = false;

let solveHistory =
JSON.parse(localStorage.getItem("rubikSolveHistory")) || [];

let currentScramble = "";


/* =========================
   SCRAMBLE
========================= */

const faces = ["R","L","U","D","F","B"];
const suffixes = ["","'","2"];

function generateScramble() {

  let result = [];
  let lastFace = "";

  while (result.length < 20) {

    const face =
      faces[Math.floor(Math.random() * faces.length)];

    if (face === lastFace) continue;

    const suffix =
      suffixes[Math.floor(Math.random() * suffixes.length)];

    result.push(face + suffix);

    lastFace = face;
  }

  return result.join(" ");
}

function newScramble() {

  currentScramble = generateScramble();

  scrambleElement.textContent = currentScramble;

  drawRubik();
}


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds) {

  if (seconds === "DNF") {
    return "DNF";
  }

  return seconds.toFixed(2);
}


/* =========================
   AVERAGE
========================= */

function calculateAverage(number) {

  if (solveHistory.length < number) {
    return "--";
  }

  const recent =
    solveHistory.slice(-number);

  if (recent.some(x => x.time === "DNF")) {
    return "DNF";
  }

  let times =
    recent.map(x => x.time);

  times.sort((a,b) => a-b);

  times.shift();
  times.pop();

  const average =
    times.reduce((a,b) => a+b, 0) / times.length;

  return average.toFixed(2);
}


/* =========================
   STATS
========================= */

function updateStats() {

  countElement.textContent =
    solveHistory.length;

  const validTimes =
    solveHistory
      .filter(x => x.time !== "DNF")
      .map(x => x.time);

  if (validTimes.length === 0) {

    pbElement.textContent = "--";

  } else {

    pbElement.textContent =
      Math.min(...validTimes).toFixed(2);
  }

  ao5Element.textContent =
    calculateAverage(5);

  ao12Element.textContent =
    calculateAverage(12);
}


/* =========================
   HISTORY
========================= */

function renderHistory() {

  solvesElement.innerHTML = "";

  if (solveHistory.length === 0) {

    solvesElement.innerHTML =
      '<div class="empty">Chưa có solve</div>';

    return;
  }

  solveHistory
    .slice()
    .reverse()
    .forEach((solve, reverseIndex) => {

      const index =
        solveHistory.length - reverseIndex - 1;

      const box =
        document.createElement("div");

      box.className = "solve";

      box.innerHTML = `

        <div class="solveTop">

          <span class="solveNumber">
            #${index + 1}
          </span>

          <span class="solveTime">
            ${formatTime(solve.time)}
          </span>

        </div>

        <div class="scrambleHistory">
          ${solve.scramble}
        </div>

        <div class="buttons">

          <button onclick="plusTwo(${index})">
            +2
          </button>

          <button onclick="setDNF(${index})">
            DNF
          </button>

          <button onclick="deleteSolve(${index})">
            🗑 Xóa
          </button>

        </div>
      `;

      solvesElement.appendChild(box);

    });
}


/* =========================
   +2
========================= */

function plusTwo(index) {

  if (solveHistory[index].time === "DNF") {
    return;
  }

  solveHistory[index].time += 2;

  saveData();

  renderHistory();

  updateStats();
}


/* =========================
   DNF
========================= */

function setDNF(index) {

  solveHistory[index].time = "DNF";

  saveData();

  renderHistory();

  updateStats();
}


/* =========================
   DELETE ONE
========================= */

function deleteSolve(index) {

  solveHistory.splice(index, 1);

  saveData();

  renderHistory();

  updateStats();
}


/* =========================
   DELETE ALL
========================= */

clearAllButton.addEventListener("click", () => {

  if (solveHistory.length === 0) {
    return;
  }

  const confirmDelete =
    confirm("Xóa toàn bộ lịch sử solve?");

  if (!confirmDelete) {
    return;
  }

  solveHistory = [];

  saveData();

  renderHistory();

  updateStats();

  timer.textContent = "0.00";
});


/* =========================
   TIMER
========================= */

function startTimer() {

  if (running) return;

  running = true;

  startTime =
    performance.now();

  startButton.textContent = "STOP";

  timerInterval =
    setInterval(() => {

      const elapsed =
        (performance.now() - startTime) / 1000;

      timer.textContent =
        elapsed.toFixed(2);

    }, 10);
}


function stopTimer() {

  if (!running) return;

  running = false;

  clearInterval(timerInterval);

  const finalTime =
    (performance.now() - startTime) / 1000;

  timer.textContent =
    finalTime.toFixed(2);

  startButton.textContent = "START";


  solveHistory.push({

    time: finalTime,

    scramble: currentScramble

  });


  saveData();

  renderHistory();

  updateStats();

  newScramble();
}


/* CHỈ NÚT START ĐIỀU KHIỂN TIMER */

startButton.addEventListener("click", () => {

  if (running) {

    stopTimer();

  } else {

    startTimer();

  }

});


/* =========================
   SAVE
========================= */

function saveData() {

  localStorage.setItem(
    "rubikSolveHistory",
    JSON.stringify(solveHistory)
  );

}


/* =========================
   RUBIK VIEW
========================= */

const colors = {
  U: "white",
  D: "yellow",
  F: "green",
  B: "blue",
  R: "red",
  L: "orange"
};


function drawFace(face) {

  const element =
    document.getElementById(face);

  element.innerHTML = "";

  for (let i = 0; i < 9; i++) {

    const sticker =
      document.createElement("div");

    sticker.className =
      "sticker " + colors[face];

    element.appendChild(sticker);

  }

}


function drawRubik() {

  drawFace("U");
  drawFace("L");
  drawFace("F");
  drawFace("R");
  drawFace("B");
  drawFace("D");

}


/* =========================
   START
========================= */

updateStats();

renderHistory();

newScramble();

</script>

</body>
</html>
