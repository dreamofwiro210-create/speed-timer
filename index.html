<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubik Speed Timer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  user-select: none;
}

.app {
  max-width: 700px;
  margin: auto;
  padding: 25px 18px 80px;
  text-align: center;
}

h1 {
  letter-spacing: 4px;
  margin-bottom: 15px;
}

#scramble {
  font-size: 20px;
  font-weight: bold;
  min-height: 30px;
  margin: 10px 0 25px;
}

#timer {
  width: 100%;
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(90px, 22vw, 170px);
  font-weight: bold;
  line-height: 1;

  cursor: pointer;
  touch-action: manipulation;
}

#timer.inspection-red {
  color: #ff3030;
}

#timer.inspection-yellow {
  color: #ffd21f;
}

#timer.ready {
  color: #22dd55;
}

#timer.dnf {
  color: #ff3030;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 50px;
  margin: 20px 0 30px;
  font-size: 18px;
}

h2 {
  text-align: left;
  margin-top: 30px;
}

.solve {
  background: #111;
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0;
  text-align: left;
}

.solve-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.solve-time {
  font-size: 24px;
  font-weight: bold;
}

.solve-scramble {
  color: #aaa;
  font-size: 14px;
  margin-top: 8px;
  line-height: 1.5;
}

.buttons {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  font-weight: bold;
  cursor: pointer;
}

.plus {
  background: #e0a800;
}

.dnf-btn {
  background: #d33;
  color: white;
}

.delete {
  background: #333;
  color: white;
}

#clear {
  width: 100%;
  margin-top: 15px;
  background: #222;
  color: white;
}

/* MINI CUBE */
#cube {
  position: fixed;
  left: 12px;
  bottom: 12px;

  width: 105px;
  height: 105px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);

  gap: 2px;
  padding: 3px;

  background: #222;
  border-radius: 8px;

  pointer-events: none;
}

.sticker {
  border-radius: 2px;
  border: 1px solid #111;
}

.white  { background: white; }
.yellow { background: #ffd900; }
.green  { background: #18b957; }
.blue   { background: #2674e8; }
.red    { background: #e83232; }
.orange { background: #ff8b18; }
</style>
</head>

<body>

<div class="app">

  <h1>SPEED TIMER</h1>

  <div id="scramble"></div>

  <div id="timer">0.00</div>

  <div class="stats">
    <span>Solves: <b id="count">0</b></span>
    <span>PB: <b id="pb">--</b></span>
  </div>

  <h2>Solves</h2>
  <div id="solves"></div>

  <button id="clear">CLEAR ALL</button>

</div>

<div id="cube"></div>

<script>

/* =========================
   SCRAMBLE
========================= */

const faces = ["R","L","U","D","F","B"];
const suffixes = ["", "'", "2"];

let currentScramble = "";

function randomScramble() {
  let result = [];
  let lastFace = "";

  while (result.length < 20) {
    const face = faces[Math.floor(Math.random() * faces.length)];

    if (face === lastFace) continue;

    const suffix =
      suffixes[Math.floor(Math.random() * suffixes.length)];

    result.push(face + suffix);
    lastFace = face;
  }

  return result.join(" ");
}

function newScramble() {
  currentScramble = randomScramble();
  document.getElementById("scramble").textContent =
    currentScramble;
}

newScramble();


/* =========================
   TIMER STATES
========================= */

const timer = document.getElementById("timer");

let state = "idle";

let inspectionStart = 0;
let inspectionInterval = null;

let solveStart = 0;
let solveInterval = null;

let holding = false;


/* =========================
   DISPLAY
========================= */

function setTimerText(text) {
  timer.textContent = text;
}

function resetTimerStyle() {
  timer.className = "";
}


/* =========================
   INSPECTION
========================= */

function startInspection() {

  if (state !== "idle") return;

  state = "inspection";

  inspectionStart = performance.now();

  timer.className = "inspection-red";
  setTimerText("15");

  inspectionInterval = setInterval(() => {

    const elapsed =
      (performance.now() - inspectionStart) / 1000;

    const remaining = 15 - elapsed;

    if (remaining <= 0) {

      clearInterval(inspectionInterval);

      state = "dnf";

      timer.className = "dnf";
      setTimerText("DNF");

      addSolve("DNF");

      setTimeout(() => {
        resetForNextSolve();
      }, 900);

      return;
    }

    const seconds = Math.ceil(remaining);

    setTimerText(seconds);

    if (remaining <= 7) {
      timer.className = "inspection-yellow";
    } else {
      timer.className = "inspection-red";
    }

  }, 50);
}


/* =========================
   HOLD DURING INSPECTION
========================= */

function holdTimer() {

  if (state !== "inspection") return;

  holding = true;

  timer.className = "ready";
}

function releaseTimer() {

  if (!holding) return;

  holding = false;

  if (state !== "inspection") return;

  clearInterval(inspectionInterval);

  state = "running";

  solveStart = performance.now();

  timer.className = "";

  solveInterval = setInterval(() => {

    const elapsed =
      (performance.now() - solveStart) / 1000;

    setTimerText(elapsed.toFixed(2));

  }, 10);
}


/* =========================
   STOP SOLVE
========================= */

function stopSolve() {

  if (state !== "running") return;

  clearInterval(solveInterval);

  const finalTime =
    (performance.now() - solveStart) / 1000;

  state = "idle";

  setTimerText(finalTime.toFixed(2));

  addSolve(finalTime);

  updateStats();

  setTimeout(() => {
    newScramble();
    renderHistory();
    resetCube();
  }, 150);
}


/* =========================
   TIMER INPUT
   CHỈ VÙNG TIMER
========================= */

timer.addEventListener("pointerdown", (e) => {

  e.preventDefault();

  if (state === "idle") {

    startInspection();

  } else if (state === "inspection") {

    holdTimer();

  } else if (state === "running") {

    stopSolve();

  }

});

timer.addEventListener("pointerup", (e) => {

  e.preventDefault();

  if (state === "inspection" && holding) {
    releaseTimer();
  }

});

timer.addEventListener("pointercancel", () => {

  if (state === "inspection" && holding) {
    releaseTimer();
  }

});


/* =========================
   KEYBOARD SPACE
========================= */

document.addEventListener("keydown", (e) => {

  if (e.code !== "Space") return;

  e.preventDefault();

  if (e.repeat) return;

  if (state === "idle") {

    startInspection();

  } else if (state === "inspection") {

    holdTimer();

  } else if (state === "running") {

    stopSolve();

  }

});

document.addEventListener("keyup", (e) => {

  if (e.code !== "Space") return;

  e.preventDefault();

  if (state === "inspection" && holding) {
    releaseTimer();
  }

});


/* =========================
   HISTORY
========================= */

let solves =
  JSON.parse(localStorage.getItem("rubikSolves") || "[]");

function addSolve(time) {

  solves.unshift({
    time: time,
    scramble: currentScramble
  });

  localStorage.setItem(
    "rubikSolves",
    JSON.stringify(solves)
  );

  renderHistory();
  updateStats();
}

function renderHistory() {

  const container =
    document.getElementById("solves");

  container.innerHTML = "";

  solves.forEach((solve, index) => {

    const div = document.createElement("div");

    div.className = "solve";

    let displayTime;

    if (solve.time === "DNF") {

      displayTime = "DNF";

    } else {

      displayTime =
        Number(solve.time).toFixed(2);

    }

    div.innerHTML = `
      <div class="solve-top">

        <span class="solve-time">
          ${displayTime}
        </span>

        <span>
          #${solves.length - index}
        </span>

      </div>

      <div class="solve-scramble">
        ${solve.scramble}
      </div>

      <div class="buttons">

        <button class="plus">
          +2
        </button>

        <button class="dnf-btn">
          DNF
        </button>

        <button class="delete">
          Delete
        </button>

      </div>
    `;

    div.querySelector(".plus").onclick = () => {

      if (solve.time === "DNF") return;

      solve.time =
        Number(solve.time) + 2;

      saveHistory();
      renderHistory();
      updateStats();

    };

    div.querySelector(".dnf-btn").onclick = () => {

      solve.time = "DNF";

      saveHistory();
      renderHistory();
      updateStats();

    };

    div.querySelector(".delete").onclick = () => {

      solves.splice(index, 1);

      saveHistory();
      renderHistory();
      updateStats();

    };

    container.appendChild(div);

  });

}

function saveHistory() {

  localStorage.setItem(
    "rubikSolves",
    JSON.stringify(solves)
  );

}


/* =========================
   STATS
========================= */

function updateStats() {

  document.getElementById("count").textContent =
    solves.length;

  const valid = solves
    .filter(x => x.time !== "DNF")
    .map(x => Number(x.time));

  if (valid.length === 0) {

    document.getElementById("pb").textContent =
      "--";

    return;
  }

  const pb = Math.min(...valid);

  document.getElementById("pb").textContent =
    pb.toFixed(2);

}


/* =========================
   CLEAR
========================= */

document.getElementById("clear").onclick = () => {

  if (!confirm("Xóa toàn bộ solves?")) return;

  solves = [];

  saveHistory();
  renderHistory();
  updateStats();

};


/* =========================
   RESET
========================= */

function resetForNextSolve() {

  clearInterval(inspectionInterval);
  clearInterval(solveInterval);

  holding = false;
  state = "idle";

  resetTimerStyle();

  setTimerText("0.00");

  newScramble();
  resetCube();
}


/* =========================
   MINI CUBE
========================= */

const cubeColors = [
  "white","white","white",
  "white","white","white",
  "white","white","white"
];

function renderCube() {

  const cube =
    document.getElementById("cube");

  cube.innerHTML = "";

  cubeColors.forEach(color => {

    const sticker =
      document.createElement("div");

    sticker.className =
      "sticker " + color;

    cube.appendChild(sticker);

  });

}

function resetCube() {

  for (let i = 0; i < 9; i++) {
    cubeColors[i] = "white";
  }

  renderCube();

}

renderCube();


/* =========================
   INIT
========================= */

renderHistory();
updateStats();

</script>

</body>
</html>
