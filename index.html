<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rubik Speed Timer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
}

button {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

/* =========================
   TIMER PAGE
========================= */

#timerPage {
  min-height: 100vh;
  padding: 20px 18px 90px;
}

.timer-container {
  width: 100%;
  max-width: 750px;
  margin: auto;
  text-align: center;
}

h1 {
  margin: 5px 0 18px;
  font-size: 28px;
  letter-spacing: 5px;
}

#scramble {
  min-height: 58px;
  font-size: 20px;
  font-weight: bold;
  line-height: 1.5;
  padding: 0 5px;
}

/* =========================
   TIMER
========================= */

#timer {
  width: 100%;
  height: 300px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(95px, 25vw, 190px);
  font-weight: 700;
  line-height: 1;

  cursor: pointer;
  touch-action: none;

  transition: color 0.1s;
}

.timer-red {
  color: #ff3030;
}

.timer-yellow {
  color: #ffd21f;
}

.timer-green {
  color: #22e35a;
}

.timer-dnf {
  color: #ff3030;
}

/* =========================
   STATS
========================= */

.stats {
  display: flex;
  justify-content: center;
  gap: 65px;

  font-size: 18px;
  margin-bottom: 25px;
}

.stats b {
  font-size: 20px;
}

/* =========================
   HISTORY BUTTON
========================= */

#historyButton {
  width: 100%;
  max-width: 400px;

  padding: 15px;

  border: none;
  border-radius: 12px;

  background: #171717;
  color: white;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#historyButton:active {
  transform: scale(.98);
}

/* =========================
   MINI RUBIK
========================= */

.mini-cube {
  position: fixed;

  left: 12px;
  bottom: 12px;

  width: 105px;
  height: 105px;

  pointer-events: none;
  z-index: 20;
}

.cube-face {
  position: absolute;

  width: 58px;
  height: 58px;

  display: grid;

  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);

  gap: 2px;

  padding: 2px;

  background: #111;
  border-radius: 4px;
}

.sticker {
  border-radius: 2px;
  border: 1px solid rgba(0,0,0,.55);
}

/* TOP */

.cube-top {
  left: 23px;
  top: 3px;

  transform:
    skewX(-28deg)
    scaleY(.65);
}

/* FRONT */

.cube-front {
  left: 8px;
  top: 40px;

  transform:
    skewY(20deg)
    scaleX(.78);
}

/* RIGHT */

.cube-right {
  left: 58px;
  top: 40px;

  transform:
    skewY(-20deg)
    scaleX(.78);
}

/* Cube colors */

.white {
  background: #f5f5f5;
}

.yellow {
  background: #ffd800;
}

.green {
  background: #19c95a;
}

.blue {
  background: #2777e8;
}

.red {
  background: #e73434;
}

.orange {
  background: #ff8918;
}

/* =========================
   HISTORY PAGE
========================= */

#historyPage {
  min-height: 100vh;
  padding: 18px;
}

.history-container {
  width: 100%;
  max-width: 750px;
  margin: auto;
}

.history-header {
  display: flex;
  align-items: center;
  gap: 12px;

  margin-bottom: 25px;
}

.back-button {
  width: 45px;
  height: 45px;

  border: none;
  background: transparent;
  color: white;

  font-size: 35px;
  line-height: 1;

  cursor: pointer;
}

.history-title {
  margin: 0;
  font-size: 28px;
}

.solve {
  background: #111;
  border-radius: 13px;

  padding: 14px;
  margin-bottom: 10px;
}

.solve-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.solve-time {
  font-size: 26px;
  font-weight: bold;
}

.solve-number {
  color: #777;
}

.solve-scramble {
  margin-top: 9px;

  color: #aaa;

  font-size: 14px;
  line-height: 1.5;
}

.solve-buttons {
  display: flex;
  gap: 7px;

  margin-top: 12px;
}

.solve-buttons button {
  border: none;
  border-radius: 8px;

  padding: 8px 13px;

  font-weight: bold;
  cursor: pointer;
}

.plus-button {
  background: #e0a800;
  color: black;
}

.dnf-button {
  background: #d83232;
  color: white;
}

.delete-button {
  background: #333;
  color: white;
}

.clear-button {
  width: 100%;

  margin-top: 8px;
  padding: 14px;

  border: none;
  border-radius: 10px;

  background: #222;
  color: white;

  font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  h1 {
    font-size: 24px;
  }

  #scramble {
    font-size: 18px;
  }

  #timer {
    height: 280px;
  }

  .mini-cube {
    transform: scale(.82);
    transform-origin: bottom left;
  }
}
</style>
</head>

<body>

<!-- =================================================
     TIMER PAGE
================================================= -->

<div id="timerPage">

  <div class="timer-container">

    <h1>SPEED TIMER</h1>

    <div id="scramble"></div>

    <div id="timer">0.00</div>

    <div class="stats">

      <div>
        Solves:
        <b id="solveCount">0</b>
      </div>

      <div>
        PB:
        <b id="personalBest">--</b>
      </div>

    </div>

    <button id="historyButton">
      HISTORY
    </button>

  </div>

</div>


<!-- =================================================
     HISTORY PAGE
================================================= -->

<div id="historyPage" class="hidden">

  <div class="history-container">

    <div class="history-header">

      <button
        class="back-button"
        id="backButton">
        ←
      </button>

      <h2 class="history-title">
        History
      </h2>

    </div>

    <div id="historyList"></div>

    <button
      class="clear-button"
      id="clearButton">
      CLEAR ALL
    </button>

  </div>

</div>


<!-- =================================================
     MINI RUBIK
================================================= -->

<div class="mini-cube">

  <div
    id="cubeTop"
    class="cube-face cube-top">
  </div>

  <div
    id="cubeFront"
    class="cube-face cube-front">
  </div>

  <div
    id="cubeRight"
    class="cube-face cube-right">
  </div>

</div>


<script>

/* =================================================
   SCRAMBLE
================================================= */

const faces = ["R", "L", "U", "D", "F", "B"];

const suffixes = ["", "'", "2"];

let currentScramble = "";


function generateScramble() {

  const moves = [];

  let previousFace = "";

  while (moves.length < 20) {

    const face =
      faces[Math.floor(Math.random() * faces.length)];

    if (face === previousFace) {
      continue;
    }

    const suffix =
      suffixes[
        Math.floor(Math.random() * suffixes.length)
      ];

    moves.push(face + suffix);

    previousFace = face;
  }

  return moves.join(" ");
}


function newScramble() {

  currentScramble = generateScramble();

  document.getElementById("scramble")
    .textContent = currentScramble;

  updateMiniCube(currentScramble);
}


/* =================================================
   TIMER VARIABLES
================================================= */

const timer =
  document.getElementById("timer");

let state = "idle";

/*
  idle
  inspection
  running
  dnf
*/

let inspectionStart = 0;

let inspectionInterval = null;

let solveStart = 0;

let solveInterval = null;

let holding = false;


/* =================================================
   START INSPECTION
================================================= */

function startInspection() {

  if (state !== "idle") {
    return;
  }

  state = "inspection";

  inspectionStart =
    performance.now();

  timer.className =
    "timer-red";

  timer.textContent = "15";

  inspectionInterval =
    setInterval(updateInspection, 40);
}


/* =================================================
   INSPECTION COUNTDOWN
================================================= */

function updateInspection() {

  const elapsed =
    (performance.now() - inspectionStart) / 1000;

  const remaining =
    15 - elapsed;

  /* HẾT 15 GIÂY */

  if (remaining <= 0) {

    clearInterval(inspectionInterval);

    inspectionInterval = null;

    holding = false;

    state = "dnf";

    timer.className =
      "timer-dnf";

    timer.textContent =
      "DNF";

    addSolve("DNF");

    setTimeout(() => {

      state = "idle";

      timer.className = "";

      timer.textContent =
        "0.00";

      newScramble();

    }, 1000);

    return;
  }


  /*
    15 → 9 = ĐỎ
    8 → 1 = VÀNG
  */

  const seconds =
    Math.ceil(remaining);

  timer.textContent =
    seconds;


  if (seconds <= 8) {

    timer.className =
      "timer-yellow";

  } else {

    timer.className =
      "timer-red";

  }
}


/* =================================================
   NHẤN GIỮ TRONG INSPECTION
================================================= */

function holdInspection() {

  if (state !== "inspection") {
    return;
  }

  holding = true;

  timer.className =
    "timer-green";
}


/* =================================================
   BUÔNG → CHẠY SOLVE
================================================= */

function releaseInspection() {

  if (!holding) {
    return;
  }

  holding = false;

  if (state !== "inspection") {
    return;
  }

  clearInterval(inspectionInterval);

  inspectionInterval = null;

  state = "running";

  solveStart =
    performance.now();

  timer.className = "";

  timer.textContent =
    "0.00";

  solveInterval =
    setInterval(updateSolve, 10);
}


/* =================================================
   RUNNING TIMER
================================================= */

function updateSolve() {

  const elapsed =
    (performance.now() - solveStart) / 1000;

  timer.textContent =
    elapsed.toFixed(2);
}


/* =================================================
   STOP SOLVE
================================================= */

function stopSolve() {

  if (state !== "running") {
    return;
  }

  clearInterval(solveInterval);

  solveInterval = null;

  const finalTime =
    (performance.now() - solveStart) / 1000;

  state = "idle";

  timer.textContent =
    finalTime.toFixed(2);

  addSolve(finalTime);

  newScramble();
}


/* =================================================
   TOUCH / MOUSE
================================================= */

timer.addEventListener(
  "pointerdown",
  function(event) {

    event.preventDefault();

    if (state === "idle") {

      startInspection();

    } else if (state === "inspection") {

      holdInspection();

    } else if (state === "running") {

      stopSolve();

    }

  }
);


timer.addEventListener(
  "pointerup",
  function(event) {

    event.preventDefault();

    if (
      state === "inspection" &&
      holding
    ) {

      releaseInspection();

    }

  }
);


timer.addEventListener(
  "pointercancel",
  function() {

    if (
      state === "inspection" &&
      holding
    ) {

      releaseInspection();

    }

  }
);


/* =================================================
   SPACE KEY
================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.code !== "Space") {
      return;
    }

    event.preventDefault();

    if (event.repeat) {
      return;
    }

    if (state === "idle") {

      startInspection();

    } else if (state === "inspection") {

      holdInspection();

    } else if (state === "running") {

      stopSolve();

    }

  }
);


document.addEventListener(
  "keyup",
  function(event) {

    if (event.code !== "Space") {
      return;
    }

    event.preventDefault();

    if (
      state === "inspection" &&
      holding
    ) {

      releaseInspection();

    }

  }
);


/* =================================================
   HISTORY DATA
================================================= */

let solves =
  JSON.parse(
    localStorage.getItem("rubikSolves") || "[]"
  );


function saveHistory() {

  localStorage.setItem(
    "rubikSolves",
    JSON.stringify(solves)
  );

}


/* =================================================
   ADD SOLVE
================================================= */

function addSolve(time) {

  solves.unshift({

    time: time,

    scramble: currentScramble

  });

  saveHistory();

  renderHistory();

  updateStats();

}


/* =================================================
   HISTORY SCREEN
================================================= */

const timerPage =
  document.getElementById("timerPage");

const historyPage =
  document.getElementById("historyPage");


document
  .getElementById("historyButton")
  .addEventListener("click", function() {

    timerPage.classList.add("hidden");

    historyPage.classList.remove("hidden");

    renderHistory();

  });


document
  .getElementById("backButton")
  .addEventListener("click", function() {

    historyPage.classList.add("hidden");

    timerPage.classList.remove("hidden");

  });


/* =================================================
   RENDER HISTORY
================================================= */

function renderHistory() {

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";

  solves.forEach(function(solve, index) {

    const item =
      document.createElement("div");

    item.className = "solve";

    const displayTime =
      solve.time === "DNF"
        ? "DNF"
        : Number(solve.time).toFixed(2);


    item.innerHTML = `

      <div class="solve-top">

        <span class="solve-time">
          ${displayTime}
        </span>

        <span class="solve-number">
          #${solves.length - index}
        </span>

      </div>

      <div class="solve-scramble">
        ${solve.scramble}
      </div>

      <div class="solve-buttons">

        <button class="plus-button">
          +2
        </button>

        <button class="dnf-button">
          DNF
        </button>

        <button class="delete-button">
          Delete
        </button>

      </div>

    `;


    /* +2 */

    item
      .querySelector(".plus-button")
      .onclick = function() {

        if (solve.time === "DNF") {
          return;
        }

        solve.time =
          Number(solve.time) + 2;

        saveHistory();

        renderHistory();

        updateStats();

      };


    /* DNF */

    item
      .querySelector(".dnf-button")
      .onclick = function() {

        solve.time = "DNF";

        saveHistory();

        renderHistory();

        updateStats();

      };


    /* DELETE */

    item
      .querySelector(".delete-button")
      .onclick = function() {

        solves.splice(index, 1);

        saveHistory();

        renderHistory();

        updateStats();

      };


    list.appendChild(item);

  });

}


/* =================================================
   CLEAR ALL
================================================= */

document
  .getElementById("clearButton")
  .onclick = function() {

    if (
      !confirm("Xóa toàn bộ lịch sử?")
    ) {
      return;
    }

    solves = [];

    saveHistory();

    renderHistory();

    updateStats();

  };


/* =================================================
   STATS
================================================= */

function updateStats() {

  document
    .getElementById("solveCount")
    .textContent =
    solves.length;


  const validTimes =
    solves
      .filter(
        solve => solve.time !== "DNF"
      )
      .map(
        solve => Number(solve.time)
      );


  if (validTimes.length === 0) {

    document
      .getElementById("personalBest")
      .textContent = "--";

    return;
  }


  const pb =
    Math.min(...validTimes);


  document
    .getElementById("personalBest")
    .textContent =
    pb.toFixed(2);

}


/* =================================================
   MINI RUBIK
================================================= */

function drawFace(elementId, colors) {

  const face =
    document.getElementById(elementId);

  face.innerHTML = "";

  colors.forEach(function(color) {

    const sticker =
      document.createElement("div");

    sticker.className =
      "sticker " + color;

    face.appendChild(sticker);

  });

}


/*
  Mini cube đổi trạng thái trực quan
  theo scramble mới.
*/

function updateMiniCube(scramble) {

  const top = [
    "white","white","white",
    "white","white","white",
    "white","white","white"
  ];

  const front = [
    "green","green","green",
    "green","green","green",
    "green","green","green"
  ];

  const right = [
    "red","red","red",
    "red","red","red",
    "red","red","red"
  ];


  const moves =
    scramble.split(" ");


  moves.forEach(function(move) {

    const face =
      move.charAt(0);


    if (face === "U") {

      top.push(top.shift());

    }


    if (face === "F") {

      front.push(front.shift());

    }


    if (face === "R") {

      right.push(right.shift());

    }

  });


  drawFace(
    "cubeTop",
    top
  );

  drawFace(
    "cubeFront",
    front
  );

  drawFace(
    "cubeRight",
    right
  );

}


/* =================================================
   START
================================================= */

renderHistory();

updateStats();

newScramble();

</script>

</body>
</html>
