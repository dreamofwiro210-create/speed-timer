<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rubik Speed Timer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #08080c;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  width: 94%;
  max-width: 600px;
  margin: auto;
  padding: 25px 0 50px;
}

/* TITLE */

h1 {
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

/* SCRAMBLE */

.scramble-box {
  background: #121218;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  margin-bottom: 20px;
}

#scramble {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.5;
  word-break: break-word;
}

/* CUBE */

.cube-section {
  background: #121218;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 20px;
}

.cube-title {
  text-align: center;
  font-weight: bold;
  margin-bottom: 12px;
  color: #aaa;
}

.cube {
  width: min(100%, 360px);
  margin: auto;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  gap: 5px;
}

/* CUBE NET */

.face {
  aspect-ratio: 1;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  gap: 2px;

  padding: 3px;

  background: #050505;

  border-radius: 6px;
}

/* vị trí từng mặt */

.face.U {
  grid-column: 2;
  grid-row: 1;
}

.face.L {
  grid-column: 1;
  grid-row: 2;
}

.face.F {
  grid-column: 2;
  grid-row: 2;
}

.face.R {
  grid-column: 3;
  grid-row: 2;
}

.face.B {
  grid-column: 4;
  grid-row: 2;
}

.face.D {
  grid-column: 2;
  grid-row: 3;
}

/* STICKER */

.sticker {
  width: 100%;
  height: 100%;

  border-radius: 3px;

  border: 1px solid #111;
}

/* COLORS */

.white {
  background: #eeeeee;
}

.yellow {
  background: #ffd900;
}

.red {
  background: #e53935;
}

.orange {
  background: #ff8c00;
}

.blue {
  background: #1976d2;
}

.green {
  background: #22a447;
}

/* TIMER */

#timer {
  text-align: center;

  font-size: clamp(65px, 18vw, 110px);

  font-weight: bold;

  margin: 25px 0;

  font-variant-numeric: tabular-nums;
}

/* STATUS */

#status {
  text-align: center;

  color: #888;

  font-size: 14px;

  margin-bottom: 15px;
}

/* STATS */

.stats {
  display: flex;

  justify-content: space-around;

  background: #121218;

  border-radius: 14px;

  padding: 15px;

  margin-bottom: 20px;

  text-align: center;
}

.stat-value {
  font-size: 22px;
  font-weight: bold;
}

/* SOLVES */

.solves-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 10px;
}

.solves-header h2 {
  margin: 0;
}

#clearAll {
  background: #292932;

  color: white;

  border: none;

  padding: 8px 12px;

  border-radius: 8px;

  cursor: pointer;
}

/* SOLVE */

.solve {
  background: #121218;

  border-radius: 12px;

  padding: 12px;

  margin-bottom: 10px;
}

.solve-top {
  display: flex;

  justify-content: space-between;

  align-items: center;
}

.solve-number {
  color: #888;
}

.solve-time {
  font-size: 22px;

  font-weight: bold;
}

.solve-buttons {
  display: flex;

  gap: 6px;

  margin-top: 10px;
}

.solve-buttons button {
  flex: 1;

  border: none;

  border-radius: 7px;

  padding: 8px;

  color: white;

  background: #292932;

  cursor: pointer;
}

.solve-buttons button:hover {
  background: #3a3a45;
}

.solve-scramble {
  color: #aaa;

  font-size: 13px;

  line-height: 1.4;

  margin-top: 8px;
}

/* EMPTY */

.empty {
  text-align: center;

  color: #666;

  padding: 25px;
}

/* MOBILE */

@media (max-width: 430px) {

  .app {
    width: 96%;
    padding-top: 15px;
  }

  #scramble {
    font-size: 17px;
  }

  .cube {
    gap: 3px;
  }

  .face {
    gap: 1.5px;
    padding: 2px;
  }

}

</style>
</head>


<body>

<div class="app">

  <h1>SPEED TIMER</h1>


  <!-- SCRAMBLE -->

  <div class="scramble-box">

    <div id="scramble">
      R U R' F2 D L' U2
    </div>

  </div>


  <!-- CUBE -->

  <div class="cube-section">

    <div class="cube-title">
      CUBE
    </div>

    <div class="cube" id="cube">

      <div class="face U" id="face-U"></div>

      <div class="face L" id="face-L"></div>

      <div class="face F" id="face-F"></div>

      <div class="face R" id="face-R"></div>

      <div class="face B" id="face-B"></div>

      <div class="face D" id="face-D"></div>

    </div>

  </div>


  <!-- TIMER -->

  <div id="timer">
    0.00
  </div>

  <div id="status">
    Giữ Space / màn hình rồi thả để bắt đầu
  </div>


  <!-- STATS -->

  <div class="stats">

    <div>
      <div>Solves</div>
      <div class="stat-value" id="count">0</div>
    </div>

    <div>
      <div>PB</div>
      <div class="stat-value" id="pb">--</div>
    </div>

    <div>
      <div>Ao5</div>
      <div class="stat-value" id="ao5">--</div>
    </div>

    <div>
      <div>Ao12</div>
      <div class="stat-value" id="ao12">--</div>
    </div>

  </div>


  <!-- SOLVES -->

  <div class="solves-header">

    <h2>Solves</h2>

    <button id="clearAll">
      Clear all
    </button>

  </div>

  <div id="solves">

    <div class="empty">
      Chưa có solve nào
    </div>

  </div>

</div>


<script>

/* =========================
   SCRAMBLE
========================= */

const faces = ["R", "L", "U", "D", "F", "B"];

const modifiers = ["", "'", "2"];

let currentScramble = "";


function generateScramble() {

  let result = [];

  let lastFace = "";

  while (result.length < 20) {

    let face =
      faces[Math.floor(Math.random() * faces.length)];

    // Không cho cùng mặt liên tiếp

    if (face === lastFace) {
      continue;
    }

    let modifier =
      modifiers[
        Math.floor(Math.random() * modifiers.length)
      ];

    result.push(face + modifier);

    lastFace = face;
  }

  currentScramble = result.join(" ");

  document.getElementById("scramble").textContent =
    currentScramble;

  updateCube();

}


/* =========================
   CUBE
========================= */

let cube = {

  U: Array(9).fill("white"),

  R: Array(9).fill("red"),

  F: Array(9).fill("green"),

  D: Array(9).fill("yellow"),

  L: Array(9).fill("orange"),

  B: Array(9).fill("blue")

};


function resetCube() {

  cube = {

    U: Array(9).fill("white"),

    R: Array(9).fill("red"),

    F: Array(9).fill("green"),

    D: Array(9).fill("yellow"),

    L: Array(9).fill("orange"),

    B: Array(9).fill("blue")

  };

}


/* xoay mặt 90 độ */

function rotateFace(face) {

  const old = [...cube[face]];

  cube[face][0] = old[6];

  cube[face][1] = old[3];

  cube[face][2] = old[0];

  cube[face][3] = old[7];

  cube[face][4] = old[4];

  cube[face][5] = old[1];

  cube[face][6] = old[8];

  cube[face][7] = old[5];

  cube[face][8] = old[2];

}


/*
   Các move dưới đây mô phỏng
   màu của cube.
*/

function moveR() {

  rotateFace("R");

  const U = [2,5,8];
  const F = [2,5,8];
  const D = [2,5,8];
  const B = [6,3,0];

  const temp = U.map(i => cube.U[i]);

  U.forEach((i,n) => cube.U[i] = cube.F[F[n]]);

  F.forEach((i,n) => cube.F[i] = cube.D[D[n]]);

  D.forEach((i,n) => cube.D[i] = cube.B[B[n]]);

  B.forEach((i,n) => cube.B[i] = temp[n]);

}


function moveL() {

  rotateFace("L");

  const U = [0,3,6];
  const F = [0,3,6];
  const D = [0,3,6];
  const B = [8,5,2];

  const temp = U.map(i => cube.U[i]);

  U.forEach((i,n) => cube.U[i] = cube.B[B[n]]);

  B.forEach((i,n) => cube.B[i] = cube.D[D[n]]);

  D.forEach((i,n) => cube.D[i] = cube.F[F[n]]);

  F.forEach((i,n) => cube.F[i] = temp[n]);

}


function moveU() {

  rotateFace("U");

  const temp = cube.F.slice(0,3);

  cube.F.splice(0,3,...cube.R.slice(0,3));

  cube.R.splice(0,3,...cube.B.slice(0,3));

  cube.B.splice(0,3,...cube.L.slice(0,3));

  cube.L.splice(0,3,...temp);

}


function moveD() {

  rotateFace("D");

  const temp = cube.F.slice(6,9);

  cube.F.splice(6,3,...cube.L.slice(6,9));

  cube.L.splice(6,3,...cube.B.slice(6,9));

  cube.B.splice(6,3,...cube.R.slice(6,9));

  cube.R.splice(6,3,...temp);

}


function moveF() {

  rotateFace("F");

  const temp = [
    cube.U[6],
    cube.U[7],
    cube.U[8]
  ];

  cube.U[6] = cube.L[8];
  cube.U[7] = cube.L[5];
  cube.U[8] = cube.L[2];

  cube.L[2] = cube.D[0];
  cube.L[5] = cube.D[1];
  cube.L[8] = cube.D[2];

  cube.D[0] = cube.R[6];
  cube.D[1] = cube.R[3];
  cube.D[2] = cube.R[0];

  cube.R[0] = temp[0];
  cube.R[3] = temp[1];
  cube.R[6] = temp[2];

}


function moveB() {

  rotateFace("B");

  const temp = [
    cube.U[0],
    cube.U[1],
    cube.U[2]
  ];

  cube.U[0] = cube.R[2];
  cube.U[1] = cube.R[5];
  cube.U[2] = cube.R[8];

  cube.R[2] = cube.D[8];
  cube.R[5] = cube.D[7];
  cube.R[8] = cube.D[6];

  cube.D[6] = cube.L[0];
  cube.D[7] = cube.L[3];
  cube.D[8] = cube.L[6];

  cube.L[0] = temp[2];
  cube.L[3] = temp[1];
  cube.L[6] = temp[0];

}


function applyMove(move) {

  const face = move[0];

  let turns = 1;

  if (move.includes("2")) {
    turns = 2;
  }

  if (move.includes("'")) {
    turns = 3;
  }

  for (let i = 0; i < turns; i++) {

    if (face === "R") moveR();

    if (face === "L") moveL();

    if (face === "U") moveU();

    if (face === "D") moveD();

    if (face === "F") moveF();

    if (face === "B") moveB();

  }

}


function updateCube() {

  resetCube();

  const moves =
    currentScramble.split(" ");

  moves.forEach(move => {

    if (move) {
      applyMove(move);
    }

  });

  renderCube();

}


function renderCube() {

  const names =
    ["U","L","F","R","B","D"];

  names.forEach(face => {

    const element =
      document.getElementById("face-" + face);

    element.innerHTML = "";

    cube[face].forEach(color => {

      const sticker =
        document.createElement("div");

      sticker.className =
        "sticker " + color;

      element.appendChild(sticker);

    });

  });

}


/* =========================
   TIMER
========================= */

let running = false;

let ready = false;

let startTime = 0;

let timerInterval = null;


function startTimer() {

  if (running) return;

  running = true;

  ready = false;

  startTime = performance.now();

  document.getElementById("status").textContent =
    "Đang chạy...";

  timerInterval = setInterval(() => {

    const time =
      (performance.now() - startTime) / 1000;

    document.getElementById("timer").textContent =
      time.toFixed(2);

  }, 10);

}


function stopTimer() {

  if (!running) return;

  running = false;

  clearInterval(timerInterval);

  const finalTime =
    (performance.now() - startTime) / 1000;

  document.getElementById("timer").textContent =
    finalTime.toFixed(2);

  addSolve(finalTime);

  document.getElementById("status").textContent =
    "Giữ Space / màn hình rồi thả để bắt đầu";

  generateScramble();

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", event => {

  if (event.code !== "Space") return;

  event.preventDefault();

  if (running) {

    stopTimer();

    return;

  }

  ready = true;

  document.getElementById("status").textContent =
    "Sẵn sàng — thả Space!";

});


document.addEventListener("keyup", event => {

  if (event.code !== "Space") return;

  event.preventDefault();

  if (!running && ready) {

    startTimer();

  }

  ready = false;

});


/* =========================
   TOUCH
========================= */

document.addEventListener("touchstart", event => {

  if (event.target.closest("button")) return;

  event.preventDefault();

  if (running) {

    stopTimer();

    return;

  }

  ready = true;

  document.getElementById("status").textContent =
    "Sẵn sàng — thả màn hình!";

}, { passive: false });


document.addEventListener("touchend", event => {

  if (event.target.closest("button")) return;

  event.preventDefault();

  if (!running && ready) {

    startTimer();

  }

  ready = false;

}, { passive: false });


/* =========================
   SOLVES
========================= */

let solves =
  JSON.parse(localStorage.getItem("rubikSolves")) || [];


function saveSolves() {

  localStorage.setItem(
    "rubikSolves",
    JSON.stringify(solves)
  );

}


function addSolve(time) {

  solves.unshift({

    time: time,

    penalty: "",

    scramble: currentScramble

  });

  saveSolves();

  renderSolves();

  updateStats();

}


function displayTime(solve) {

  if (solve.penalty === "DNF") {
    return "DNF";
  }

  const time =
    solve.time +
    (solve.penalty === "+2" ? 2 : 0);

  return time.toFixed(2) +
    (solve.penalty === "+2" ? "+" : "");

}


function renderSolves() {

  const container =
    document.getElementById("solves");

  container.innerHTML = "";

  if (solves.length === 0) {

    container.innerHTML =
      '<div class="empty">Chưa có solve nào</div>';

    return;

  }

  solves.forEach((solve, index) => {

    const div =
      document.createElement("div");

    div.className = "solve";

    div.innerHTML = `

      <div class="solve-top">

        <span class="solve-number">
          #${solves.length - index}
        </span>

        <span class="solve-time">
          ${displayTime(solve)}
        </span>

      </div>

      <div class="solve-buttons">

        <button onclick="plusTwo(${index})">
          +2
        </button>

        <button onclick="dnf(${index})">
          DNF
        </button>

        <button onclick="deleteSolve(${index})">
          🗑️
        </button>

      </div>

      <div class="solve-scramble">
        ${solve.scramble}
      </div>

    `;

    container.appendChild(div);

  });

}


function plusTwo(index) {

  if (solves[index].penalty === "DNF") {
    return;
  }

  solves[index].penalty =
    solves[index].penalty === "+2"
      ? ""
      : "+2";

  saveSolves();

  renderSolves();

  updateStats();

}


function dnf(index) {

  solves[index].penalty =
    solves[index].penalty === "DNF"
      ? ""
      : "DNF";

  saveSolves();

  renderSolves();

  updateStats();

}


function deleteSolve(index) {

  solves.splice(index, 1);

  saveSolves();

  renderSolves();

  updateStats();

}


document
  .getElementById("clearAll")
  .addEventListener("click", () => {

    if (solves.length === 0) return;

    if (!confirm("Xóa toàn bộ solve?")) return;

    solves = [];

    saveSolves();

    renderSolves();

    updateStats();

  });


/* =========================
   STATS
========================= */

function validTimes() {

  return solves

    .filter(s => s.penalty !== "DNF")

    .map(s =>
      s.time +
      (s.penalty === "+2" ? 2 : 0)
    );

}


function formatAverage(times) {

  if (times.length === 0) {
    return "--";
  }

  const average =
    times.reduce((a,b) => a+b, 0)
    / times.length;

  return average.toFixed(2);

}


function calculateAverage(n) {

  const recent =
    solves.slice(0,n);

  if (recent.length < n) {
    return "--";
  }

  let times =
    recent.map(s => {

      if (s.penalty === "DNF") {
        return Infinity;
      }

      return s.time +
        (s.penalty === "+2" ? 2 : 0);

    });

  /*
     WCA style:
     bỏ nhanh nhất + chậm nhất
  */

  times.sort((a,b) => a-b);

  if (!Number.isFinite(times[0])) {
    return "--";
  }

  times.shift();

  times.pop();

  if (times.some(t => !Number.isFinite(t))) {
    return "--";
  }

  return formatAverage(times);

}


function updateStats() {

  document.getElementById("count").textContent =
    solves.length;

  const times =
    validTimes();

  if (times.length > 0) {

    document.getElementById("pb").textContent =
      Math.min(...times).toFixed(2);

  } else {

    document.getElementById("pb").textContent =
      "--";

  }

  document.getElementById("ao5").textContent =
    calculateAverage(5);

  document.getElementById("ao12").textContent =
    calculateAverage(12);

}


/* =========================
   START
========================= */

generateScramble();

renderSolves();

updateStats();

</script>

</body>
</html>
